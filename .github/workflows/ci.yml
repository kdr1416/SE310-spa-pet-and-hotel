name: CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  frontend-check:
    name: Frontend (Vue 3 / Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit & regression tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend distribution
        working-directory: frontend
        run: npm run build

  backend-check:
    name: Backend (.NET / xUnit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PETSPA_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/PetSpa.sln

      - name: Build backend solution
        run: dotnet build backend/PetSpa.sln --no-restore

      - name: Run unit & integration tests
        env:
          Logging__LogLevel__Default: Warning
          Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
        run: >-
          dotnet test backend/PetSpa.sln --no-build --verbosity minimal
          --logger "console;verbosity=minimal"
          --logger "trx;LogFileName=backend.trx"
          --results-directory TestResults/backend

      - name: Summarize backend tests
        if: always()
        shell: pwsh
        run: ./.github/scripts/Write-TestSummary.ps1 -ResultsDirectory TestResults/backend -SummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/backend/**/*.trx
          if-no-files-found: warn
          retention-days: 7
