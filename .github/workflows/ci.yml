name: CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  frontend-check:
    name: Frontend (Vue 3 / Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit & regression tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend distribution
        working-directory: frontend
        run: npm run build

  backend-check:
    name: Backend (.NET / xUnit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/PetSpa.sln

      - name: Build backend solution
        run: dotnet build backend/PetSpa.sln --no-restore

      - name: Run unit & integration tests
        run: dotnet test backend/PetSpa.sln --no-build --verbosity normal
